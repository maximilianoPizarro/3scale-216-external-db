{{- if .Values.threescale.externalDb.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: system-database
  namespace: 3scale-db
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.threescale.vault.secretStore }}
  target:
    name: system-database
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: {{ .Values.threescale.vault.postgresqlKey | quote }}
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.threescale.vault.postgresqlKey | quote }}
        property: password
{{- if .Values.threescale.externalComponents.system.database }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: system-database
  namespace: 3scale
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.threescale.vault.secretStore }}
  target:
    name: system-database
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        DB_USER: "{{ `{{ .username }}` }}"
        DB_PASSWORD: "{{ `{{ .password }}` }}"
        URL: "{{ `postgresql://{{ .username }}:{{ .password | urlquery }}@system-postgresql-service.3scale-db.svc.cluster.local/system` }}"
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.threescale.vault.postgresqlKey | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.threescale.vault.postgresqlKey | quote }}
        property: password
{{- end }}
{{- if .Values.threescale.externalComponents.system.redis }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: system-redis
  namespace: 3scale
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.threescale.vault.secretStore }}
  target:
    name: system-redis
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        URL: "{{ `redis://:{{ .password | urlquery }}@system-redis-service.3scale-db.svc.cluster.local:6379/1` }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.threescale.vault.systemRedisKey | quote }}
        property: password
{{- end }}
{{- if .Values.threescale.externalComponents.backend.redis }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-redis
  namespace: 3scale
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.threescale.vault.secretStore }}
  target:
    name: backend-redis
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        REDIS_STORAGE_URL: "{{ `redis://:{{ .password | urlquery }}@backend-redis-service.3scale-db.svc.cluster.local:6379/0` }}"
        REDIS_QUEUES_URL: "{{ `redis://:{{ .password | urlquery }}@backend-redis-service.3scale-db.svc.cluster.local:6379/1` }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.threescale.vault.backendRedisKey | quote }}
        property: password
{{- end }}
{{- if .Values.threescale.redis.auth.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: system-redis-auth
  namespace: 3scale-db
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.threescale.vault.secretStore }}
  target:
    name: system-redis-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.threescale.vault.systemRedisKey | quote }}
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-redis-auth
  namespace: 3scale-db
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.threescale.vault.secretStore }}
  target:
    name: backend-redis-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.threescale.vault.backendRedisKey | quote }}
        property: password
{{- end }}
{{- end }}
