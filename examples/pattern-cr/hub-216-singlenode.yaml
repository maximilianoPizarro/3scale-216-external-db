# Single-node sandbox: 3scale 2.16 with external PostgreSQL and Redis.
# Until this branch is merged, targetRevision stays on the feature branch.
# After merge, set targetRevision to main.
apiVersion: gitops.hybrid-cloud-patterns.io/v1alpha1
kind: Pattern
metadata:
  name: 3scale-216-external-db
  namespace: openshift-operators
spec:
  clusterGroupName: hub
  extraValueFiles:
    - /values-216-singlenode.yaml
  gitSpec:
    targetRepo: https://github.com/maximilianoPizarro/3scale-216-external-db.git
    targetRevision: feat/image-digests-vault-eso
  multiSourceConfig:
    enabled: true
    clusterGroupChartVersion: "0.9.*"
    helmRepoUrl: https://charts.validatedpatterns.io
