apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: threescale-external-db-placement
  namespace: openshift-gitops
  labels:
    cluster.open-cluster-management.io/placement: threescale-external-db-placement
    app.kubernetes.io/name: threescale-external-db
    app.kubernetes.io/part-of: 3scale
    platform.io/gitops-strategy: acm-push
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  clusterSets:
    - global
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: threescale-external-db
              operator: In
              values:
                - "true"
