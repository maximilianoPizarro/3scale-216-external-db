apiVersion: apps/v1
kind: Deployment
metadata:
  name: system-postgresql-external
  labels:
    app: system-postgresql-external
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      deployment: system-postgresql-external
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        deployment: system-postgresql-external
        app: system-postgresql-external
    spec:
      containers:
        - name: system-postgresql-external
          image: registry.redhat.io/rhel9/postgresql-15
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  key: DB_USER
                  name: system-database
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: DB_PASSWORD
                  name: system-database
            - name: POSTGRESQL_DATABASE
              value: system
          ports:
            - containerPort: 5432
              protocol: TCP
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: 5432
            timeoutSeconds: 1
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -i
                - -c
                - psql -h 127.0.0.1 -U $POSTGRESQL_USER -q -d $POSTGRESQL_DATABASE -c 'SELECT 1'
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - mountPath: /var/lib/pgsql/data
              name: postgresql-data-external
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      serviceAccountName: postgresql-db-external
      terminationGracePeriodSeconds: 30
      volumes:
        - name: postgresql-data-external
          persistentVolumeClaim:
            claimName: postgresql-data-external
