apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: system-redis
  namespace: 3scale
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: system-redis
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        URL: "redis://system-redis-service.3scale-db.svc.cluster.local:6379/1"
        SENTINEL_HOSTS: ""
        SENTINEL_ROLE: ""
  data:
    - secretKey: password
      remoteRef:
        key: secret/data/hub/3scale-system-redis
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-redis
  namespace: 3scale
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: backend-redis
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        REDIS_STORAGE_URL: "redis://backend-redis-service.3scale-db.svc.cluster.local:6379/0"
        REDIS_STORAGE_SENTINEL_HOSTS: ""
        REDIS_STORAGE_SENTINEL_ROLE: ""
        REDIS_QUEUES_URL: "redis://backend-redis-service.3scale-db.svc.cluster.local:6379/1"
        REDIS_QUEUES_SENTINEL_HOSTS: ""
        REDIS_QUEUES_SENTINEL_ROLE: ""
  data:
    - secretKey: password
      remoteRef:
        key: secret/data/hub/3scale-backend-redis
        property: password
---
