# Edit REPLACE_APPS_DOMAIN. It is the same value as global.localClusterDomain
# in vault-values.yaml. The route host is vault-vault.<apps domain>.
# Auth is a token in Secret vault-token. Do not commit that Secret.
# The openshift-external-secrets chart instead uses Kubernetes auth role hub-role,
# which the Validated Patterns Operator creates. This overlay does not install that operator.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: https://vault-vault.REPLACE_APPS_DOMAIN
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: kube-root-ca.crt
        key: ca.crt
        namespace: external-secrets
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
          namespace: external-secrets
