apiVersion: operator.openshift.io/v1alpha1
kind: ExternalSecretsConfig
metadata:
  name: cluster
  labels:
    app.kubernetes.io/name: external-secrets-operator
spec:
  controllerConfig:
    networkPolicies:
      - name: allow-vault-access
        componentName: ExternalSecretsCoreController
        egress:
          - ports:
              - protocol: TCP
                port: 443
