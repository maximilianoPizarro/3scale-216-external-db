apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: 3scale-db
resources:
  - ../../bases/namespace
  - ../../bases/postgresql
  - ../../bases/redis-config-restore
  - ../../bases/redis-backend
  - ../../bases/redis-system
images:
