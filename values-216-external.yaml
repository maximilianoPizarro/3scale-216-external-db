# Steady state after 2.15 already reads the external databases.
# This file only switches the channel to threescale-2.16.
# Point extraValueFiles here after the fresh dump and the 2.15 verification on the restore.
# values-215-external.yaml is the step before this one.
# Keep the ReadWriteMany class used for system-storage. Do not switch it to gp3-csi.
# Child Applications only inherit files listed in global.extraValueFiles.
global:
  extraValueFiles:
    - /values-216-external.yaml

clusterGroup:
  subscriptions:
    threescale:
      channel: threescale-2.16

threescale:
  externalDb:
    enabled: true
  redis:
    auth:
      enabled: true
    configMode: persist
  externalComponents:
    system:
      database: true
      redis: true
    backend:
      redis: true
  storage:
    systemStorageClass: efs-sc
