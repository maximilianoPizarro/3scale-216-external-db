---
global:
  pattern: 3scale-216-external-db
  options:
    useCSV: false
    syncPolicy: Automatic
    installPlanApproval: Automatic

main:
  clusterGroupName: hub
  multiSourceConfig:
    enabled: true
    clusterGroupChartVersion: "0.9.*"
    helmRepoUrl: https://charts.validatedpatterns.io

# Digests are the linux/amd64 manifests resolved from registry.redhat.io on 2026-10-15.
# Bump both values together and roll the three database Deployments.
threescale:
  images:
    postgresql: registry.redhat.io/rhel9/postgresql-15@sha256:242c66cfab1873ecbde84ba8c8bf7488b1c40a820f41820d76efa58634519826
    redis: registry.redhat.io/rhel9/redis-7@sha256:81535d5fd51bc5e83108db6f86a15b6b22412922d4a590235d1fba56751b967a
  vault:
    # ClusterSecretStore created by the openshift-external-secrets chart.
    secretStore: vault-backend
    # KV v2 paths written by `make load-secrets` from values-secret.yaml.
    postgresqlKey: secret/data/hub/3scale-postgresql
    systemRedisKey: secret/data/hub/3scale-system-redis
    backendRedisKey: secret/data/hub/3scale-backend-redis
