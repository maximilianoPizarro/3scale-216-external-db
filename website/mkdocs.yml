site_name: 3scale 2.15 → 2.16 migration
site_description: In-cluster PostgreSQL and Redis externalization before upgrading to 3scale 2.16
site_url: https://maximilianopizarro.github.io/3scale-216-external-db/
repo_url: https://github.com/maximilianoPizarro/3scale-216-external-db
repo_name: 3scale-216-external-db
edit_uri: edit/main/website/docs/

theme:
  name: material
  custom_dir: overrides
  language: en
  icon:
    repo: fontawesome/brands/github
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - scheme: default
      primary: black
      accent: blue grey
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: blue grey
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search:
      lang:
        - en
        - es
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          site_name: Migración 3scale 2.15 → 2.16
          site_description: Externalización in-cluster de PostgreSQL y Redis antes de actualizar a 3scale 2.16
          nav_translations:
            Home: Inicio
            Why this repo: Motivación
            Prerequisites: Requisitos previos
            Official documentation: Documentación oficial
            Tested versions: Versiones probadas
            Migration sequence: Secuencia de migración
            Install 3scale 2.15 (lab): Instalar 3scale 2.15 (lab)
            Externalize PostgreSQL: Externalizar PostgreSQL
            Externalize Redis: Externalizar Redis
            Upgrade operator to 2.16: Actualizar operador a 2.16
            Rollback: Rollback
            GitOps and RHACM: GitOps y RHACM
            Day 2 operations: Operación día 2
            Operations FAQ: FAQ de operación

nav:
  - Home: index.md
  - Why this repo: why.md
  - Prerequisites: prerequisites.md
  - Official documentation: official-docs.md
  - Tested versions: tested-versions.md
  - Migration sequence: sequence.md
  - Install 3scale 2.15 (lab): install-lab.md
  - Externalize PostgreSQL: externalize-postgresql.md
  - Externalize Redis: externalize-redis.md
  - Upgrade operator to 2.16: upgrade-216.md
  - Rollback: rollback.md
  - GitOps and RHACM: gitops.md
  - Day 2 operations: day-2.md
  - Operations FAQ: faq.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/maximilianoPizarro/3scale-216-external-db
      name: GitHub
    - icon: material/web
      link: https://maximilianopizarro.github.io/3scale-216-external-db/
      name: GitHub Pages

extra_css:
  - stylesheets/ibm-docs.css
